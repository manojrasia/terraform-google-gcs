name: Release Terraform module to Nexus

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Module version, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    uses: manojrasia/terraform-github-actions-templates/.github/workflows/terraform-module-release.yml@terraformgcp
    with:
      module_name: terraform-google-gcs
      version: ${{ inputs.version || '' }}
      terraform_version: "1.9.8"
      working_directory: "."
      nexus_repository: ${{ vars.NEXUS_RAW_REPOSITORY }}
    secrets:
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
