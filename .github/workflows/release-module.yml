name: Release Terraform module to Nexus

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Module version, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, linux, nexus-local]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Package module
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="terraform-google-gcs-${{ steps.version.outputs.value }}.zip"
          zip "$PACKAGE" main.tf variables.tf outputs.tf README.md
          sha256sum "$PACKAGE" > "$PACKAGE.sha256"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Upload release to Nexus Raw repository
        shell: bash
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_REPOSITORY: ${{ vars.NEXUS_RAW_REPOSITORY }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          : "${NEXUS_URL:?Missing NEXUS_URL secret}"
          : "${NEXUS_REPOSITORY:?Missing NEXUS_RAW_REPOSITORY variable}"
          : "${NEXUS_USERNAME:?Missing NEXUS_USERNAME secret}"
          : "${NEXUS_PASSWORD:?Missing NEXUS_PASSWORD secret}"

          BASE="${NEXUS_URL%/}/repository/${NEXUS_REPOSITORY}/terraform-google-gcs/${{ steps.version.outputs.value }}"
          for FILE in "$PACKAGE" "$PACKAGE.sha256"; do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --user "$NEXUS_USERNAME:$NEXUS_PASSWORD" "$BASE/$FILE" || true)
            if [[ "$STATUS" == "200" ]]; then
              echo "Release already exists: $FILE" >&2
              exit 1
            fi
          done

          curl --fail --show-error --user "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            --upload-file "$PACKAGE" "$BASE/$PACKAGE"
          curl --fail --show-error --user "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            --upload-file "$PACKAGE.sha256" "$BASE/$PACKAGE.sha256"
